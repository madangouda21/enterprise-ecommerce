server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/products/**

            - id: cart-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/carts/**

            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/orders/**

            - id: inventory-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/inventory/**

            - id: payment-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/payments/**

            - id: shipping-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/shipping/**

            - id: review-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/reviews/**

            - id: notification-service
              uri: http://localhost:8090
              predicates:
                - Path=/api/v1/notifications/**
