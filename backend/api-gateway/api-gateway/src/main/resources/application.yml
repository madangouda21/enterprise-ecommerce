server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:

          # =========================
          # CORS
          # =========================
          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS

                allowedHeaders:
                  - "*"

                allowCredentials: true

          # =========================
          # GATEWAY ROUTES
          # =========================
          routes:

            # =========================
            # AUTH SERVICE - 8081
            # =========================
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            # =========================
            # USER SERVICE - 8082
            # =========================
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**

            # =========================
            # PRODUCT SERVICE - 8083
            # =========================
            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/products/**

            # =========================
            # CART SERVICE - 8084
            # =========================
            - id: cart-service
              uri: http://localhost:8084
              predicates:
                - Path=/cart/**

            # =========================
            # ORDER SERVICE - 8085
            # =========================
            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/orders/**

            # =========================
            # INVENTORY SERVICE - 8086
            # =========================
            - id: inventory-service
              uri: http://localhost:8086
              predicates:
                - Path=/inventory/**

            # =========================
            # PAYMENT SERVICE - 8087
            # =========================
            - id: payment-service
              uri: http://localhost:8087
              predicates:
                - Path=/payments/**

            # =========================
            # SHIPPING SERVICE - 8088
            # =========================
            - id: shipping-service
              uri: http://localhost:8088
              predicates:
                - Path=/shipping/**

            # =========================
            # REVIEW SERVICE - 8089
            # =========================
            - id: review-service
              uri: http://localhost:8089
              predicates:
                - Path=/reviews/**

            # =========================
            # NOTIFICATION SERVICE - 8090
            # =========================
            - id: notification-service
              uri: http://localhost:8090
              predicates:
                - Path=/notifications/**